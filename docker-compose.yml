services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nestly}
      MYSQL_USER: ${MYSQL_USER:-nestly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nestly_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports: ["3306:3306"]
    volumes: ["nestly_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nestly}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-nestly}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-nestly_dev}
      NESTLY_JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-characters}
      NESTLY_AI_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      ai-service: {condition: service_started}

  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  nestly_mysql:

