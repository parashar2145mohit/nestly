spring:
  application:
    name: nestly
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nestly}?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:nestly}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:nestly_dev}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: always
nestly:
  jwt-secret: ${NESTLY_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-characters}
  ai-url: ${NESTLY_AI_URL:http://${NESTLY_AI_HOST:localhost}:${NESTLY_AI_PORT:8000}}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
